<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>文档中心 · YaYa bot</title>
  <link rel="stylesheet" href="/style.css?v=20261117-1">
  <link rel="stylesheet" href="/documents.css?v=20261117-1">
</head>
<body>
  <header class="topbar">
    <a class="brand brand-link" href="/"><span class="brand-mark">Y</span><div><strong>YaYa bot</strong><span data-i18n="brand.tagline">你的定时任务小帮手</span></div></a>
    <div class="header-actions"><select id="language-switcher" class="language-switcher" data-i18n-aria-label="language.label" aria-label="界面语言"><option value="zh">简体中文</option><option value="en">English</option></select><a class="button button-secondary" href="/" data-i18n="nav.backTasks">返回任务</a></div>
  </header>

  <main class="docs-container">
    <section class="docs-hero">
      <p class="eyebrow">YAYA KNOWLEDGE BASE</p>
      <h1 data-i18n="docs.heroTitle">需要帮忙？来翻翻文档。</h1>
      <p data-i18n="docs.heroDescription">使用指南、AI 接入方法和安全说明，都替你放在这里了。</p>
    </section>

    <div class="docs-layout">
      <aside class="panel docs-sidebar">
        <div class="docs-sidebar-heading"><h2 data-i18n="docs.all">全部文档</h2><span id="document-count" class="count-badge">0 篇</span></div>
        <nav id="document-list" class="document-list" data-i18n-aria-label="docs.listAria" aria-label="文档列表"></nav>
        <div id="document-list-empty" class="docs-empty" data-i18n="docs.emptyList" hidden>文档还在准备中，稍后再来看看。</div>
      </aside>

      <article class="panel docs-reader">
        <div id="document-content" class="markdown-body"><div class="docs-loading" data-i18n="docs.loading">正在打开文档…</div></div>
      </article>
    </div>
    <footer><span data-i18n="docs.footer">YaYa bot · 文档中心</span><span data-i18n="docs.footerHint">新增 Markdown 文档会自动出现在这里</span></footer>
  </main>
  <script src="/i18n.js?v=20261117-1"></script>
  <script src="/documents.js?v=20261117-1"></script>
</body>
</html>
